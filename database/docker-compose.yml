version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: moedaquest_db
    environment:
      POSTGRES_DB: moedaquest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: senha123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: